<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Page not found — Word42</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a5fb4">
<link rel="icon" type="image/svg+xml" href="/images/icon.svg">
<link rel="apple-touch-icon" href="/images/icon-180.png">
<link rel="stylesheet" href="/css/bootstrap.min.css">
<style>
  :root {
    --w42-blue: #1a5fb4;
    --w42-rule: #c0bfbc;
  }
  .font-serif {
    font-family: 'Times New Roman', 'Liberation Serif', Tinos, Times, serif;
  }
  .text-w42 { color: var(--w42-blue) !important; }
  .btn-w42 {
    background-color: var(--w42-blue);
    border-color: var(--w42-blue);
    color: #fff;
  }
  .btn-w42:hover, .btn-w42:focus {
    background-color: #164f96;
    border-color: #164f96;
    color: #fff;
  }
  .navbar-brand { font-size: 1.5rem; }
  h1 { font-weight: 700; color: var(--w42-blue); }
  footer { border-top: 1px solid var(--w42-rule); }
</style>
</head>
<body>

<nav class="navbar navbar-expand navbar-light bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand font-serif font-weight-bold text-w42" href="/">
      <img src="/images/icon.svg" width="34" height="34" alt="" style="vertical-align:middle;">
      Word42
    </a>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" href="https://github.com/office-42/word42">GitHub</a></li>
    </ul>
  </div>
</nav>

<main class="py-5">
  <div class="container text-center py-5">
    <h1 class="mb-3">Page not found</h1>
    <p class="lead mb-4">There is no page at this address.</p>
    <p><a class="btn btn-w42 btn-lg" href="/">Go to the front page</a></p>
  </div>
</main>

<footer class="py-4 bg-white">
  <div class="container">
    <p class="small text-muted mb-0">
      <a href="https://github.com/office-42/word42">github.com/office-42/word42</a> ·
      <a href="/privacy">Privacy</a> · word42.org
    </p>
  </div>
</footer>

</body>
</html>
