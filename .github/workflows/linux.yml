# SPDX-License-Identifier: GPL-3.0-or-later
name: Linux

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache gcc pkg-config meson ninja-build \
            libgtk-4-dev libpango1.0-dev libcairo2-dev libglib2.0-dev \
            libpoppler-glib-dev libenchant-2-dev hunspell-en-us \
            libhyphen-dev hyphen-en-us mythes-en-us \
            liblexbor-dev cmake xvfb \
            fonts-crosextra-carlito fonts-crosextra-caladea python3

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          export CC="ccache gcc"
          ccache --max-size=200M
          meson setup builddir --werror

      - name: Build
        run: meson compile -C builddir

      - name: Smoke test
        # GTK needs a display even to construct a window, so the run happens
        # under Xvfb.  --help exits without entering the main loop, which is
        # enough to prove the binary links and its resources are registered.
        run: xvfb-run -a ./builddir/src/word42 --help

      # The engine without a window: every sample written in every format
      # and read back, the XML of what is written parsed, and the Bible
      # laid out.  Carlito and Caladea, installed above, are the fonts its
      # page count is checked in.
      - name: Smoke test the engine
        run: sh build-aux/smoke-test.sh builddir/src/word42-convert

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: word42-linux
          path: builddir/src/word42
          retention-days: 14
