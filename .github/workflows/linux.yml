# SPDX-License-Identifier: GPL-3.0-or-later
name: Linux

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache gcc pkg-config meson ninja-build \
            libgtk-4-dev libpango1.0-dev libcairo2-dev libglib2.0-dev \
            libpoppler-glib-dev libenchant-2-dev hunspell-en-us \
            libhyphen-dev hyphen-en-us \
            cmake xvfb

      # Ubuntu does not package Lexbor yet, so it is built from a pinned
      # release; the cache keeps that to one cmake run per version.
      - name: Restore Lexbor
        id: lexbor-cache
        uses: actions/cache@v4
        with:
          path: ~/lexbor-install
          key: lexbor-v2.7.0-${{ runner.os }}

      - name: Build Lexbor
        if: steps.lexbor-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v2.7.0 https://github.com/lexbor/lexbor.git ~/lexbor-src
          cmake -S ~/lexbor-src -B ~/lexbor-src/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/lexbor-install"
          cmake --build ~/lexbor-src/build -j"$(nproc)"
          cmake --install ~/lexbor-src/build

      - name: Install Lexbor
        run: |
          sudo cp -a "$HOME/lexbor-install/include/." /usr/local/include/
          sudo cp -a "$HOME/lexbor-install/lib/." /usr/local/lib/
          sudo ldconfig

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          export CC="ccache gcc"
          ccache --max-size=200M
          meson setup builddir --werror

      - name: Build
        run: meson compile -C builddir

      - name: Smoke test
        # GTK needs a display even to construct a window, so the run happens
        # under Xvfb.  --help exits without entering the main loop, which is
        # enough to prove the binary links and its resources are registered.
        run: xvfb-run -a ./builddir/src/word42 --help

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: word42-linux
          path: builddir/src/word42
          retention-days: 14
