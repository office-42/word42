# SPDX-License-Identifier: GPL-3.0-or-later
name: macOS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install meson ninja pkg-config gtk4 pango cairo glib gdk-pixbuf lexbor poppler enchant ccache dylibbundler
          # Hyphenation is optional; not every Homebrew has the formula.
          brew install hyphen || echo "no hyphen formula; building without hyphenation"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      - name: Configure
        run: |
          export CC="ccache clang"
          ccache --max-size=200M
          # No --werror here: Apple clang warns about different things than
          # the GCC the other two jobs use, and a warning it invents on its
          # own should not turn the tree red.  Warnings are still in the log.
          meson setup builddir

      - name: Build
        run: meson compile -C builddir

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: word42-macos
          path: builddir/src/word42
          retention-days: 14

      - name: Bundle
        run: |
          # The log tail becomes an annotation, readable without admin rights.
          if ! W42_BUNDLE_VERBOSE=1 bash build-aux/bundle-macos.sh builddir Word42.app > bundle.log 2>&1; then
            tail -n 60 bundle.log
            echo "::error title=bundle::$(tail -n 25 bundle.log | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
          tail -n 5 bundle.log
          ditto -c -k --keepParent Word42.app word42-macos.zip
          ls -l word42-macos.zip

      - name: Upload app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: word42-macos-app
          path: word42-macos.zip
          retention-days: 30
