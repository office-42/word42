# SPDX-License-Identifier: GPL-3.0-or-later
name: Windows

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
          pacboy: >-
            toolchain:p
            pkgconf:p
            meson:p
            ninja:p
            ccache:p
            gtk4:p
            pango:p
            cairo:p
            glib2:p
            gdk-pixbuf2:p
            lexbor:p
            poppler:p
            enchant:p
            hunspell-en:p
            hyphen:p
            hyphen-en:p

      - name: Show toolchain
        run: |
          gcc --version | head -1
          meson --version
          pkg-config --modversion gtk4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Configure
        run: |
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          export CC="ccache gcc"
          ccache --max-size=200M
          meson setup builddir --werror

      - name: Build
        run: |
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          meson compile -C builddir

      - name: Bundle
        run: |
          bash build-aux/bundle-windows.sh builddir dist
          cp README.md LICENSE dist/ 2>/dev/null || true

      - name: Upload bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: word42-windows
          path: dist
          retention-days: 30

      # Inno Setup is on the runner image; the installer wraps the bundle.
      - name: Installer
        run: |
          version=$(sed -n "s/^  version: '\([^']*\)',/\1/p" meson.build | head -1)
          python3 build-aux/make-ico.py data/icons build-aux/word42.ico
          # MSYS would turn /D... into D:\...; leave the arguments alone.
          MSYS2_ARG_CONV_EXCL="*" "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DAppVersion=$version" "/DSourceDir=$(cygpath -w "$PWD/dist")" \
            "/O$(cygpath -w "$PWD/installer")" \
            "$(cygpath -w "$PWD/build-aux/word42.iss")"
          ls -l installer

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: word42-windows-installer
          path: installer/*.exe
          retention-days: 30
